name: iOS local engine
on:
  push:
    branches: ['feat/ios-local-engine']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loader:
    name: DSH Loader source and desktop prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Test exporter without executing supplier packages
        run: python3 -m unittest discover -s tooling -p test_prepare_ios_loader.py -v
      - name: Resolve exact official dependency lock into isolated seed
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-ios-seed"
          cp runtime/locks/dsh-0.2.2-rc.3/package*.json "$RUNNER_TEMP/dsh-ios-seed/"
          npm ci --prefix "$RUNNER_TEMP/dsh-ios-seed" --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Export reviewed pure-JS Loader composition
        run: python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --output "$RUNNER_TEMP/dsh-ios-loader"
      - name: Exercise real DSH Loader and bad-baseline rejection
        run: node runtime/ios/test-loader.mjs "$RUNNER_TEMP/dsh-ios-loader"
      - name: Export exact tested Loader bundle for the iOS job
        run: tar -czf "$RUNNER_TEMP/dsh-ios-loader.tar.gz" -C "$RUNNER_TEMP/dsh-ios-loader" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-dsh-loader-input
          path: ${{ runner.temp }}/dsh-ios-loader.tar.gz
          retention-days: 7
  ios:
    needs: loader
    name: iPhone and iPad embedded runtime
    runs-on: macos-15
    timeout-minutes: 50
    env:
      FLUTTER_VERSION: 3.47.7
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Disable generated Swift Package integration for CocoaPods runtime
        run: flutter config --no-enable-swift-package-manager
      - name: Resolve locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate interface strings on GitHub
        run: |
          python3 app/tool/l10n_merge.py
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Validate runtime lock and downloader contracts
        run: |
          python3 tooling/prepare_ios_runtime.py --check
          python3 -m unittest discover -s tooling -p test_prepare_ios_runtime.py -v
          node --test runtime/ios/probe.test.cjs
      - name: Download and verify the embedded iOS framework
        run: python3 tooling/prepare_ios_runtime.py --download
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ios-dsh-loader-input
          path: ${{ runner.temp }}/ios-loader-input
      - name: Stage the exact tested Loader bundle in native resources
        run: |
          mkdir -p app/ios/EmbeddedNode/Resources/dsh-loader
          tar -xzf "$RUNNER_TEMP/ios-loader-input/dsh-ios-loader.tar.gz" -C app/ios/EmbeddedNode/Resources/dsh-loader
      - name: Analyze application
        working-directory: app
        run: flutter analyze --no-pub
      - name: Resolve test fonts
        run: |
          mkdir -p "$RUNNER_TEMP/test-fonts"
          for weight in Light Regular Bold; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/test-fonts/NotoSansCJK-$weight.ttc" "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTC/NotoSansCJK-$weight.ttc"
          done
      - name: Test iOS channel, readiness and platform isolation
        id: widget-tests
        continue-on-error: true
        working-directory: app
        env:
          DSH_TEST_FONT_DIR: ${{ runner.temp }}/test-fonts
        run: flutter test --no-pub test/ios
      - name: Build iOS Simulator application
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-pub --build-name 0.2.2 --build-number "$GITHUB_RUN_NUMBER" -v 2>&1 | tee "$RUNNER_TEMP/ios-simulator-build.log"
      - name: Verify Simulator artifact
        run: python3 tooling/verify_ios_build.py app/build/ios/iphonesimulator/Runner.app --simulator --output dist/ios/simulator-verification.json
      - name: Execute Node inside actual iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild test -workspace app/ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/ios-node-probe.xcresult" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/ios-node-probe.log"
      - name: Build unsigned iPhone and iPad application
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub --build-name 0.2.2 --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify device application
        run: |
          python3 tooling/verify_ios_build.py app/build/ios/iphoneos/Runner.app --output dist/ios/device-verification.json
          printf 'source=%s\ntarget=iPhone,iPad\nDSH_BOOT_VERIFIED=false\nSIGNING=none\n' "$GITHUB_SHA" > dist/ios/build-info.txt
          tar -czf dist/ios/unsigned-iphone-ipad-app.tar.gz -C app/build/ios/iphoneos Runner.app
      - name: Enforce widget regression result after independent iOS builds
        if: always() && steps.widget-tests.outcome != 'success'
        run: |
          echo 'Widget regressions failed; build evidence does not override that result.'
          exit 1
      - name: Preserve cloud-generated localization sources
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-generated-localization
          path: |
            app/lib/l10n/gen/
            app/lib/l10n/app_*.arb
          retention-days: 7
      - name: Preserve build and embedded probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-build-and-probe
          path: |
            dist/ios/
            runtime/.cache/ios/*report*.json
            ${{ runner.temp }}/ios-node-probe.xcresult
            ${{ runner.temp }}/ios-node-probe.log
            ${{ runner.temp }}/ios-simulator-build.log
            app/ios/Pods/Target Support Files/DshEmbeddedNode/
          if-no-files-found: warn
          retention-days: 7
