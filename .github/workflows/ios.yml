name: iOS local engine
on:
  push:
    branches: ['feat/ios-local-engine']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  # Keep running Simulator evidence when another verification commit lands.
  cancel-in-progress: false
jobs:
  loader:
    name: DSH Loader source and desktop prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Verify upstream version selection and export rules
        run: |
          python3 -m unittest discover -s tooling -p test_ios_engine_pin.py -v
          python3 -m unittest discover -s tooling -p test_prepare_ios_loader.py -v
      - name: Resolve exact official dependency lock into isolated seed
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-ios-seed"
          lock_dir=$(python3 tooling/ios_engine_pin.py lock-directory)
          cp "$lock_dir"/package.json "$lock_dir"/package-lock.json "$RUNNER_TEMP/dsh-ios-seed/"
          npm ci --prefix "$RUNNER_TEMP/dsh-ios-seed" --engine-strict --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Export reviewed pure-JS Loader composition
        run: python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --output "$RUNNER_TEMP/dsh-ios-loader"
      - name: Exercise real DSH Loader and bad-baseline rejection
        run: node runtime/ios/test-loader.mjs "$RUNNER_TEMP/dsh-ios-loader"
      - name: Export and exercise the actual in-memory DSH AgentLoop
        run: |
          python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --phase core --output "$RUNNER_TEMP/dsh-ios-core"
          node runtime/ios/test-core.mjs "$RUNNER_TEMP/dsh-ios-core"
      - name: Verify real SQLite persistence and cold AgentLoop resume
        run: |
          python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --phase persistence --output "$RUNNER_TEMP/dsh-ios-persistence"
          node runtime/ios/test-persistence.mjs "$RUNNER_TEMP/dsh-ios-persistence"
      - name: Test production text chat with the official adapter and simulated HTTPS response
        run: |
          python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --phase chat --output "$RUNNER_TEMP/dsh-ios-chat"
          node runtime/ios/test-chat.mjs "$RUNNER_TEMP/dsh-ios-chat"
      - name: Prepare exact official DSH browser assets for WebKit validation
        run: |
          python3 tooling/prepare_ios_web.py --seed "$RUNNER_TEMP/dsh-ios-seed" --output "$RUNNER_TEMP/dsh-ios-web-frontend"
          tar -czf "$RUNNER_TEMP/dsh-ios-web-frontend.tar.gz" -C "$RUNNER_TEMP/dsh-ios-web-frontend" .
          node runtime/ios/export-web-bootstrap.mjs --seed "$RUNNER_TEMP/dsh-ios-seed" --output "$RUNNER_TEMP/dsh-ios-web-bootstrap"
          node runtime/ios/test-web-bootstrap.mjs "$RUNNER_TEMP/dsh-ios-seed" "$RUNNER_TEMP/dsh-ios-web-bootstrap"
          tar -czf "$RUNNER_TEMP/dsh-ios-web-bootstrap.tar.gz" -C "$RUNNER_TEMP/dsh-ios-web-bootstrap" .
      - name: Prove official session RPC and streaming from the audited test bundle
        run: |
          python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --phase official-host-ci --output "$RUNNER_TEMP/dsh-ios-official-host-ci"
          node runtime/ios/test-official-host.mjs "$RUNNER_TEMP/dsh-ios-official-host-ci"
          node runtime/ios/test-official-app-services.mjs "$RUNNER_TEMP/dsh-ios-official-host-ci"
          node runtime/ios/test-official-app-routes.mjs
          node runtime/ios/test-official-app-host.mjs "$RUNNER_TEMP/dsh-ios-official-host-ci"
          tar -czf "$RUNNER_TEMP/dsh-ios-official-host-ci.tar.gz" -C "$RUNNER_TEMP/dsh-ios-official-host-ci" .
      - name: Export the lock-pinned official sidebar and composer preview
        run: node runtime/ios/export-web-shell-preview.mjs "$RUNNER_TEMP/dsh-ios-seed" "$RUNNER_TEMP/dsh-ios-web-shell-preview" "$RUNNER_TEMP/dsh-ios-official-host-ci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-official-web-shell-preview
          path: ${{ runner.temp }}/dsh-ios-web-shell-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Export separate production Host and official text-chat assets
        run: |
          python3 tooling/prepare_ios_loader.py --seed "$RUNNER_TEMP/dsh-ios-seed" --phase official-app --output "$RUNNER_TEMP/dsh-ios-official-app"
          node runtime/ios/test-official-app-host.mjs "$RUNNER_TEMP/dsh-ios-official-app"
          node runtime/ios/test-official-app-mailbox.mjs "$RUNNER_TEMP/dsh-ios-official-app"
          node runtime/ios/export-web-shell-preview.mjs "$RUNNER_TEMP/dsh-ios-seed" "$RUNNER_TEMP/dsh-ios-official-web" "$RUNNER_TEMP/dsh-ios-official-app" --app
          for phase in official-app official-web; do
            tar -czf "$RUNNER_TEMP/dsh-ios-$phase.tar.gz" -C "$RUNNER_TEMP/dsh-ios-$phase" .
          done
      - name: Export exact tested runtime bundles for the iOS job
        run: |
          for phase in loader core persistence chat; do
            tar -czf "$RUNNER_TEMP/dsh-ios-$phase.tar.gz" -C "$RUNNER_TEMP/dsh-ios-$phase" .
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-dsh-loader-input
          path: |
            ${{ runner.temp }}/dsh-ios-loader.tar.gz
            ${{ runner.temp }}/dsh-ios-core.tar.gz
            ${{ runner.temp }}/dsh-ios-persistence.tar.gz
            ${{ runner.temp }}/dsh-ios-chat.tar.gz
            ${{ runner.temp }}/dsh-ios-web-frontend.tar.gz
            ${{ runner.temp }}/dsh-ios-web-bootstrap.tar.gz
            ${{ runner.temp }}/dsh-ios-official-host-ci.tar.gz
            ${{ runner.temp }}/dsh-ios-official-app.tar.gz
            ${{ runner.temp }}/dsh-ios-official-web.tar.gz
          retention-days: 7
  ios:
    needs: loader
    name: iPhone and iPad embedded runtime
    runs-on: macos-15
    timeout-minutes: 50
    env:
      FLUTTER_VERSION: 3.47.7
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Disable generated Swift Package integration for CocoaPods runtime
        run: flutter config --no-enable-swift-package-manager
      - name: Resolve locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate interface strings on GitHub
        run: |
          python3 app/tool/l10n_merge.py
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Validate runtime lock and downloader contracts
        run: |
          python3 tooling/prepare_ios_runtime.py --check
          python3 -m unittest discover -s tooling -p test_prepare_ios_runtime.py -v
          node --test runtime/ios/probe.test.cjs
      - name: Download and verify the embedded iOS framework
        run: python3 tooling/prepare_ios_runtime.py --download
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ios-dsh-loader-input
          path: ${{ runner.temp }}/ios-loader-input
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ios-official-web-shell-preview
          path: app/ios/RunnerTests/dsh-web-shell-preview
      - name: Stage the exact tested DSH bundles in native resources
        run: |
          for phase in loader core persistence chat; do
            destination="app/ios/EmbeddedNode/Resources/dsh-$phase"
            mkdir -p "$destination"
            tar -xzf "$RUNNER_TEMP/ios-loader-input/dsh-ios-$phase.tar.gz" -C "$destination"
          done
          for phase in web-frontend web-bootstrap official-app official-web; do
            web="app/ios/EmbeddedNode/Resources/dsh-$phase"
            mkdir -p "$web"
            tar -xzf "$RUNNER_TEMP/ios-loader-input/dsh-ios-$phase.tar.gz" -C "$web"
          done
          cp runtime/ios/official-web-bridge.js app/ios/EmbeddedNode/Resources/official-web-bridge.js
          ci="app/ios/RunnerTests/dsh-official-host-ci"
          mkdir -p "$ci"
          tar -xzf "$RUNNER_TEMP/ios-loader-input/dsh-ios-official-host-ci.tar.gz" -C "$ci"
      - name: Analyze application
        working-directory: app
        run: flutter analyze --no-pub
      - name: Resolve test fonts
        run: |
          mkdir -p "$RUNNER_TEMP/test-fonts"
          for weight in Light Regular Bold; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/test-fonts/NotoSansCJK-$weight.ttc" "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTC/NotoSansCJK-$weight.ttc"
          done
      - name: Test iOS channel, readiness and platform isolation
        id: widget-tests
        continue-on-error: true
        working-directory: app
        env:
          DSH_TEST_FONT_DIR: ${{ runner.temp }}/test-fonts
        run: flutter test --no-pub test/ios
      - name: Build iOS Simulator application
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-pub --build-name 0.2.2 --build-number "$GITHUB_RUN_NUMBER" -v 2>&1 | tee "$RUNNER_TEMP/ios-simulator-build.log"
      - name: Verify Simulator artifact
        id: simulator-verification
        run: python3 tooling/verify_ios_build.py app/build/ios/iphonesimulator/Runner.app --simulator --output dist/ios/simulator-verification.json
      - name: Execute Node inside actual iOS Simulator
        id: simulator-tests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          # Run the process-wide Node test separately from render-only tests.
          # This gives both gates an independent App lifecycle and result bundle.
          set +e
          xcodebuild test -workspace app/ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$device" -parallel-testing-enabled NO -only-testing:RunnerTests/RunnerTests/testEmbeddedNodeExecutesInsideIOS -resultBundlePath "$RUNNER_TEMP/ios-node-probe.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-node-probe.log"
          engine_result=$?
          xcodebuild test -workspace app/ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$device" -parallel-testing-enabled NO -skip-testing:RunnerTests/RunnerTests/testEmbeddedNodeExecutesInsideIOS -resultBundlePath "$RUNNER_TEMP/ios-web-render.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-web-render.log"
          web_result=$?
          test "$engine_result" -eq 0 && test "$web_result" -eq 0
      - name: Export actual simulator JSON observations
        if: always()
        run: |
          result="$RUNNER_TEMP/ios-node-probe.xcresult"
          if [ -f "$result/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$result" | tee dist/ios/simulator-test-summary.json
            xcrun xcresulttool export attachments --path "$result" --output-path dist/ios/test-attachments
          fi
          web="$RUNNER_TEMP/ios-web-render.xcresult"
          if [ -f "$web/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$web" | tee dist/ios/web-simulator-test-summary.json
            xcrun xcresulttool export attachments --path "$web" --output-path dist/ios/web-test-attachments
          fi
      - name: Build unsigned iPhone and iPad application
        if: always() && steps.simulator-verification.outcome == 'success'
        id: device-build
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub --build-name 0.2.2 --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify device application
        if: always() && steps.device-build.outcome == 'success'
        id: device-verification
        run: |
          python3 tooling/verify_ios_build.py app/build/ios/iphoneos/Runner.app --output dist/ios/device-verification.json
          printf 'source=%s\ntarget=iPhone,iPad\nsimulator_gate=%s\nwidget_gate=%s\nfull_official_parity=false\nsigning=none\n' "$GITHUB_SHA" '${{ steps.simulator-tests.outcome }}' '${{ steps.widget-tests.outcome }}' > dist/ios/build-info.txt
          tar -czf dist/ios/unsigned-iphone-ipad-app.tar.gz -C app/build/ios/iphoneos Runner.app
      - name: Package the verified device App as an unsigned development IPA
        if: always() && steps.device-verification.outcome == 'success'
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/dsh-ios-ipa.XXXXXXXX")
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage/Payload"
          ditto --norsrc app/build/ios/iphoneos/Runner.app "$stage/Payload/Runner.app"
          ipa="$PWD/dist/ios/DeepSeek-Harness-iOS-${GITHUB_SHA:0:7}-unsigned.ipa"
          ditto -c -k --norsrc --keepParent "$stage/Payload" "$ipa"
          unzip -tq "$ipa"
          python3 - "$ipa" <<'PY'
          from pathlib import PurePosixPath
          import plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as ipa:
              for name in ipa.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
                  assert path.parts[:2] == ('Payload', 'Runner.app') or name == 'Payload/'
              info = plistlib.loads(ipa.read('Payload/Runner.app/Info.plist'))
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'] and info['UIDeviceFamily'] == [1, 2]
              assert 'Payload/Runner.app/' + info['CFBundleExecutable'] in ipa.namelist()
          PY
          (cd dist/ios && shasum -a 256 "${ipa##*/}" > "${ipa##*/}.sha256")
      - name: Enforce widget regression result after independent iOS builds
        if: always() && steps.widget-tests.outcome != 'success'
        run: |
          echo 'Widget regressions failed; build evidence does not override that result.'
          exit 1
      - name: Preserve cloud-generated localization sources
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-generated-localization
          path: |
            app/lib/l10n/gen/
            app/lib/l10n/app_*.arb
          retention-days: 7
      - name: Preserve build and embedded probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-build-and-probe
          path: |
            dist/ios/
            runtime/.cache/ios/*report*.json
            ${{ runner.temp }}/ios-node-probe.xcresult
            ${{ runner.temp }}/ios-node-probe.log
            ${{ runner.temp }}/ios-web-render.xcresult
            ${{ runner.temp }}/ios-web-render.log
            ${{ runner.temp }}/ios-simulator-build.log
            app/ios/Pods/Target Support Files/DshEmbeddedNode/
          if-no-files-found: warn
          retention-days: 7
