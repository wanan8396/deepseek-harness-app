# Check the current Lite shell and official runtime builder, never a patched host.
# External PRs are closed by pr-gate.yml and spend no runner here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the ARM64 shell for local runtime assembly and signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - '.github/workflows/ci.yml'
              - 'app/**'
              - 'runtime/**'
              - 'tooling/**'
              - 'docs/guide/**'
              - 'THIRD_PARTY_NOTICES.md'

  checks:
    name: Lite generated files, tooling and official runtime
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Current generated files are in sync
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Web swipe and settings bridge regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/web-input-tests" --no-save --package-lock=false --ignore-scripts jsdom@27.4.0
          NODE_PATH="$RUNNER_TEMP/web-input-tests/node_modules" node --test tooling/test_web_swipe.mjs tooling/test_web_settings_document.mjs
      - name: Python desktop regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q Pillow==13.0.0
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tooling -p 'test_*.py' -v
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s runtime/tests -p 'test_*.py' -v
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s app/tool -p 'test_l10n*.py' -v
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s app/tool -p test_guide_sync.py -v

  flutter:
    name: Flutter Lite shell
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore the test fonts
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - name: Save the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - name: Install the fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Analyze the current shell
        run: flutter analyze --no-pub
      - name: Lite startup, computer routing and appearance
        run: flutter test --no-pub --concurrency=4 --reporter github test/local_web_lite
      - name: Keep golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-golden-failures
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android shell JVM
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - *checkout
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest

  apk:
    name: ARM64 shell for local assembly
    needs: [checks, flutter, android]
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - *checkout
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - name: Resolve locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      # Gradle resolves its whole dependency graph on a cold runner; the shared
      # android job caches it already, and this build repeats that work without
      # the cache for no gain beyond isolation.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-
      - name: Compile shell only
        run: |
          # No runtime or signing material lives in this repository. This is
          # an intermediate shell, never an installable/release deliverable.
          # Local assembly must add and verify the unchanged runtime payload,
          # zipalign, sign with the installed app's key and verify the result.
          code=$(python3 tooling/build_number.py)
          version=$(python3 -c 'import json; print(json.load(open("runtime/locks/dsh-0.2.2-rc.5/package.json"))["dependencies"]["@deepseek-ai/dsh"])')
          (cd app && flutter build apk --release --flavor arm64 --target-platform android-arm64 --build-name "$version" --build-number "$code" --dart-define="DSH_APP_VERSION=$version+$code")
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk dist/deepseek-harness-arm64-shell-NOT-INSTALLABLE.apk
          printf 'source=%s\nversion=%s\nversionCode=%s\nruntime=missing\nsigning=temporary-ci-debug\n' "$GITHUB_SHA" "$version" "$code" > dist/build-info.txt
      - name: Upload intermediate shell
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepseek-harness-arm64-shell
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, checks, flutter, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.changes.result != 'success' || needs.checks.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (needs.changes.outputs.app == 'true' && (needs.flutter.result != 'success' || needs.android.result != 'success'))
        run: exit 1
